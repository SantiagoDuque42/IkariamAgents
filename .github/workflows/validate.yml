name: Validate contracts and learning

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install jsonschema==4.26.0
      - run: npm ci --prefix integrations/ikariam-chatgpt --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run test:chatgpt
