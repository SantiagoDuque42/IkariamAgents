  <text x="988" y="358" class="t">Strategist</text>
  <text x="988" y="380" class="s">Claude session + engine</text>
  <text x="988" y="400" class="s">simulate · diff · calibrate</text>
  <text x="988" y="420" class="s">orders with exec blocks</text>
  <path d="M892 280 C935 290 940 350 968 360" class="l" marker-end="url(#a)"/>
