  <text x="988" y="188" class="t">AtlasImporter</text>
  <text x="988" y="209" class="s">Apps Script, runs as the player</text>
  <text x="988" y="229" class="s">one handler per schema</text>
  <line x1="892" y1="207" x2="968" y2="200" class="l" marker-end="url(#a)"/>
  <path d="M970 236 C940 250 930 270 894 275" class="l" marker-end="url(#a)"/>
