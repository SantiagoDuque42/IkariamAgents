<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Inter, 'Open Sans', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d6779"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3362f"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a6a24"/></marker>
    <style>
      .box{fill:#fff;stroke:#c9ced8;stroke-width:1.5;rx:10}
      .t{font-size:17px;font-weight:600;fill:#18243a}
      .s{font-size:13px;fill:#5d6779}
      .h{font-size:13px;font-weight:700;fill:#9a6a24;letter-spacing:.08em}
      .l{stroke:#5d6779;stroke-width:1.6;fill:none}
