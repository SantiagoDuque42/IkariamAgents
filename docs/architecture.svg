  <text x="330" y="122" class="h">EXTRACTORS · READ-ONLY</text>
  <text x="650" y="122" class="h">STORE · DRIVE</text>
  <text x="970" y="122" class="h">IMPORT · PLAN</text>
  <text x="1290" y="122" class="h">OUTPUTS · PEOPLE</text>

  <!-- column 1 -->
