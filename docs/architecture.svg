  <path d="M1100 608 C1100 520 1100 480 1100 452" class="l" marker-end="url(#a)"/>
  <text x="1108" y="540" class="lab">reads approved orders</text>

  <!-- GitHub -->
  <rect x="40" y="760" width="580" height="80" class="box"/>
  <text x="60" y="790" class="t">GitHub · IkariamAgents (public)</text>
  <text x="60" y="812" class="s">code · schemas · tests · bookmarklets · ATLAS branches · no game data</text>

  <!-- legend -->
  <g transform="translate(650 770)">
    <line x1="0" y1="10" x2="40" y2="10" class="l" marker-end="url(#a)"/><text x="50" y="14" class="lab">read / data flow</text>
    <line x1="170" y1="10" x2="210" y2="10" stroke="#b3362f" stroke-width="2.4" marker-end="url(#r)"/><text x="220" y="14" class="lab">acts in the game</text>
    <line x1="340" y1="10" x2="380" y2="10" class="l plan" marker-end="url(#a)"/><text x="390" y="14" class="lab">planned</text>
    <line x1="470" y1="10" x2="510" y2="10" stroke="#9a6a24" stroke-width="1.6" marker-end="url(#b)"/><text x="520" y="14" class="lab">writes orders</text>
