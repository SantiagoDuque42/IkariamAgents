  <text x="60" y="250" class="s">Hideout reports</text>
  <rect x="40" y="420" width="230" height="80" class="box"/>
  <text x="60" y="452" class="t">ikadatos.com</text>
  <text x="60" y="474" class="s">islands · players · inactives</text>

  <!-- column 2 extractors -->
  <g>
    <rect x="330" y="150" width="260" height="52" class="box"/><text x="348" y="174" class="t">Mayor</text><text x="348" y="193" class="s">own empire snapshot</text>
    <rect x="330" y="214" width="260" height="52" class="box"/><text x="348" y="238" class="t">Cartographer · game</text><text x="348" y="257" class="s">area + filters, island details</text>
    <rect x="330" y="278" width="260" height="52" class="box"/><text x="348" y="302" class="t">Spymaster</text><text x="348" y="321" class="s">spy reports + targets</text>
    <rect x="330" y="342" width="260" height="52" class="box plan"/><text x="348" y="366" class="t" fill="#5d6779">Military history · Transports</text><text x="348" y="385" class="s">planned exporters</text>
    <rect x="330" y="434" width="260" height="52" class="box"/><text x="348" y="458" class="t">Cartographer · ikadatos</text><text x="348" y="477" class="s">runs on the ikadatos page</text>
