  <rect x="1290" y="150" width="270" height="52" class="box"/><text x="1308" y="174" class="t">Farmeos</text><text x="1308" y="193" class="s">targets + Historial</text>
  <rect x="1290" y="214" width="270" height="52" class="box plan"/><text x="1308" y="238" class="t" fill="#5d6779">Historial militar</text><text x="1308" y="257" class="s">planned · own spreadsheet</text>
  <rect x="1290" y="278" width="270" height="52" class="box plan"/><text x="1308" y="302" class="t" fill="#5d6779">Transportes</text><text x="1308" y="321" class="s">planned · own spreadsheet</text>
  <line x1="1230" y1="190" x2="1288" y2="176" class="l" marker-end="url(#a)"/>
  <line x1="1230" y1="205" x2="1288" y2="240" class="l plan" marker-end="url(#a)"/>
  <line x1="1230" y1="220" x2="1288" y2="304" class="l plan" marker-end="url(#a)"/>

  <rect x="1290" y="380" width="270" height="96" class="box" stroke="#1f4e79" stroke-width="2"/>
  <text x="1308" y="410" class="t">Player</text>
  <text x="1308" y="432" class="s">reads plans, approves steps</text>
  <text x="1308" y="452" class="s">in chat · the only interface</text>
  <path d="M1230 400 C1255 400 1262 420 1288 420" class="l" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="1236" y="372" class="lab">plans ⇄ input</text>

  <!-- Basileus -->
  <rect x="650" y="610" width="620" height="104" class="box" stroke="#b3362f" stroke-width="2"/>
  <text x="670" y="640" class="t">Basileus · executor</text>
  <text x="670" y="662" class="s">Claude in Chrome on the player's browser: precheck → act through the UI → postcheck</text>
  <text x="670" y="682" class="s">approved steps only (chat, or a scheduled task's prompt) · builds · transports · workers/wine</text>
  <text x="670" y="702" class="s">policy limits · quiet hours · stops on captcha, logout, surprises · journal every step</text>
  <path d="M1425 476 C1425 560 1330 640 1272 650" class="l" marker-end="url(#a)" stroke="#1f4e79"/>
  <text x="1438" y="520" class="lab">approves steps:</text><text x="1438" y="537" class="lab">on demand, set times</text><text x="1438" y="554" class="lab">or interval</text>
  <path d="M648 664 C470 664 300 650 300 580 L300 400 C300 385 292 376 274 372" fill="none" stroke="#b3362f" stroke-width="2.4" marker-end="url(#r)"/>
  <text x="316" y="560" font-size="13" font-weight="600" fill="#b3362f">UI clicks: the only</text><text x="316" y="578" font-size="13" font-weight="600" fill="#b3362f">writer to the game</text>
